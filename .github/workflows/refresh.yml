name: Refresh Tidbyt NCAAF Scores

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pixlet
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/tidbyt/pixlet/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d '"' -f 4)
          echo "Downloading: $DOWNLOAD_URL"
          curl -L -o pixlet.tar.gz "$DOWNLOAD_URL"
          tar -xzf pixlet.tar.gz
          chmod +x pixlet
          sudo mv pixlet /usr/local/bin/pixlet
          pixlet version

      - name: Render app
        run: pixlet render ncaaf_scores.star

      - name: Push to Tidbyt
        run: |
          pixlet push \
            --api-token "${{ secrets.TIDBYT_API_TOKEN }}" \
            --installation-id ncaaf_scores \
            "${{ secrets.TIDBYT_DEVICE_ID }}" \
            ncaaf_scores.webp
